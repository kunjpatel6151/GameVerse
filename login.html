<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login</title>
  <link href="login.css" rel="stylesheet" type="text/css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="script.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <script>
    function myFunction() {
      var x = document.getElementById("myInput");
      if (x.type === "password") {
        x.type = "text";
      } else {
        x.type = "password";
      }
    }
    function validateform() {
      var x = document.forms["login"]["user"].value;
      var y = document.forms["login"]["pass"].value;
      var agree = document.getElementById("check").checked
      if (x == "") {
        alert("Name must be filled out");
        return false;
      }
      if (/^\d+$/.test(x)) {
        alert("Name must be alphanumeric");
        return false;
      }
      if (y.length < 8) {
        alert("password must contain atleast 8 characters");
        return false;
      }
      if (agree == false) {
        alert("Please Agree terms and conditions");
        return false;
      }
    }
  </script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>
  <div class="container">
    <div class="login">
      <div class="logo"></div>
      <br>
      <hr>
      <div class="title">Login</div>
      <form name="login" action="index.html" method="post" onsubmit="return validateform()">
        <div class="field">Username:</div>
        <input type="text" name="user" id="user" placeholder="username" class="input">
        <div class="field">Password:</div>
        <input type="password" value="password" name="pass" id="myInput" class="input"><input id="show" type="checkbox"
          onclick="myFunction()">
        <div class="show">show</div>
        <div class="down">
          <div class="text"><input type="checkbox" id="check"> Agree,Terms and Conditions</div>
          <button type="submit" class="button" name="submit" id="submit">Login</button>
          <div class="text">Don't have an account? <b><a href="signup.html">Signup</a></b></div>
        </div>
      </form>
    </div>
  </div>
</body>

</html>
